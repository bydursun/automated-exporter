<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #0f1b2d; color: #e8eef5; }
  .header { padding: 16px 18px 12px; border-bottom: 2px solid #1e3148; }
  .header h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: .2px; }
  .header p { margin: 4px 0 0; font-size: 12px; color: #8aa0b8; }
  .body { padding: 16px 18px; }
  .client { background: #16263b; border: 1px solid #21384f; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
  .client .label { color: #8aa0b8; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .client .value { font-weight: 600; margin-top: 2px; word-break: break-word; }
  button { width: 100%; padding: 11px; border: none; border-radius: 8px; background: #c9a227; color: #1a1206; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s; }
  button:hover:not(:disabled) { background: #d8b43a; }
  button:disabled { background: #3a4658; color: #7e8da0; cursor: not-allowed; }
  .progress-wrap { margin-top: 14px; display: none; }
  .bar { height: 8px; background: #16263b; border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #c9a227, #e0c24a); transition: width .3s; }
  .count { font-size: 12px; color: #8aa0b8; margin-top: 6px; text-align: center; }
  .log { margin-top: 12px; max-height: 140px; overflow-y: auto; font-size: 11px; font-family: ui-monospace, "SF Mono", Menlo, monospace; background: #0b1422; border: 1px solid #1e3148; border-radius: 8px; padding: 8px 10px; line-height: 1.5; display: none; }
  .log div { color: #b8c8da; }
  .log .ok { color: #6fd49a; }
  .log .err { color: #f0857d; }
  .credit { padding: 10px 18px 14px; border-top: 1px solid #1e3148; font-size: 11px; color: #8aa0b8; text-align: center; }
  .credit a { color: #c9a227; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="header">
    <h1>Automated Exporter</h1>
    <p>Demo &mdash; auto-paginate &amp; export to PDF</p>
  </div>
  <div class="body">
    <div class="client">
      <div class="label">Subject</div>
      <div class="value" id="clientName">Checking page&hellip;</div>
    </div>
    <button id="startBtn" disabled>Start Export</button>
    <div class="progress-wrap" id="progressWrap">
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <div class="count" id="count">0 / 0</div>
    </div>
    <div class="log" id="log"></div>
  </div>
  <div class="credit">
    Created by Abdullah Dursun &middot;
    <a href="https://www.linkedin.com/in/abdullah-dursun41" target="_blank" rel="noopener">LinkedIn</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
